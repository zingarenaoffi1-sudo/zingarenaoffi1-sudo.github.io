<!DOCTYPE html>

<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <title>Zing.Arena Dashboard</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 80px; padding-bottom: 80px; margin: 0; min-height: 100vh; }
        .app-container { width: 90%; max-width: 600px; text-align: center; }
        #greetingMessage { margin-bottom: 10px; color: #60a5fa; font-weight: 300; font-size: 1.2rem; }
        #searchInput { width: 100%; padding: 15px; margin-bottom: 30px; border-radius: 30px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; text-align: center; box-sizing: border-box; font-size: 1.1rem; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 20px; transition: 0.5s; }
        .blurred { opacity: 0.3; pointer-events: none; filter: blur(3px); }
        .menu-item { background: #1e293b; padding: 40px 20px; border-radius: 30px; cursor: pointer; transition: 0.3s; border: 2px solid #334155; font-size: 1.5rem; font-weight: bold; }
        .menu-item span { display: block; font-size: 3rem; margin-bottom: 10px; }
        .menu-item:hover { background: #3b82f6; transform: translateY(-10px); border-color: #60a5fa; }

        /* TERMS BOX - BOTTOM LEFT */
        .terms-box { position: fixed; bottom: 20px; left: 20px; padding: 15px; background: #1e293b; border-radius: 15px; border: 1px solid #334155; font-size: 14px; z-index: 9998; }

        /* PURANE CORNER ADS (Nap5k) */
        .corner-ad { position: fixed; z-index: 9999; max-width: 150px; max-height: 150px; overflow: hidden; }
        .top-left { top: 15px; left: 15px; }
        .top-right { top: 15px; right: 15px; }
        .bottom-right { bottom: 15px; right: 15px; } 

        @media (max-width: 768px) {
            .corner-ad { transform: scale(0.6); max-width: 120px; max-height: 120px; }
            .top-left { transform-origin: top left; }
            .top-right { transform-origin: top right; }
            .bottom-right { transform-origin: bottom right; }
        }

        /* --- ADSTERRA CSS (5 ADS PLACEMENT) --- */
        .adsterra-wrapper { position: fixed; z-index: 10000; }
        
        /* Corners */
        .adsterra-tl { top: 10px; left: 10px; }
        .adsterra-tr { top: 10px; right: 10px; }
        .adsterra-br { bottom: 10px; right: 10px; }
        
        /* Middle Placements */
        .adsterra-tc { top: 10px; left: 50%; transform: translateX(-50%); }
        .adsterra-bc { bottom: 10px; left: 50%; transform: translateX(-50%); }

        @media (max-width: 768px) {
            .adsterra-wrapper { transform: scale(0.5); }
            .adsterra-tl { transform-origin: top left; }
            .adsterra-tr { transform-origin: top right; }
            .adsterra-br { transform-origin: bottom right; }
            /* Mobile par center align theek rakhne ke liye */
            .adsterra-tc { transform: translateX(-50%) scale(0.5); transform-origin: top center; }
            .adsterra-bc { transform: translateX(-50%) scale(0.5); transform-origin: bottom center; }
        }
    </style>
</head>

<!-- TERMS BOX: BOTTOM LEFT -->
<div class="terms-box">
    <input type="checkbox" id="termsCheck" checked onchange="toggleAccess()">
    <label for="termsCheck"> I agree to the <a href="terms.html" style="color: #3b82f6;">Terms & Conditions</a></label>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
            .catch(err => console.log('SW Failed', err));
        });
    }

    function setGreeting() {
        let hour = new Date().getHours();
        let greeting = (hour < 12)? "Good Morning! ☀️" : (hour < 18)? "Good Afternoon! 🌤️" : "Good Evening! 🌙";
        document.getElementById('greetingMessage').innerText = greeting;
    }
    setGreeting();

    function toggleAccess() {
        let isChecked = document.getElementById('termsCheck').checked; 
        let menu = document.getElementById('mainMenu');
        menu.classList.toggle('blurred',!isChecked);
    }

    function filterTools() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let items = document.getElementsByClassName('menu-item');
        for (let i = 0; i < items.length; i++) {
            items[i].style.display = items[i].innerText.toLowerCase().includes(input)? "" : "none";
        }
    }
</script>
