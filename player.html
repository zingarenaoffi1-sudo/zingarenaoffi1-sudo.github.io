<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zing Multi-Platform Player</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- YOUTUBE IFRAME API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 15px; }
        .container { max-width: 500px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #334155; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2563eb; }
        
        #playerContainer { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; margin-bottom: 20px; overflow: hidden; display: none; background: #000; border-radius: 8px; border: 1px solid #1e293b; }
        
        /* Iframe/Player Wrapper */
        #videoFrameWrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #mainPlayer { width: 100%; height: 100%; border: none; }
        
        #errorOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(30, 41, 59, 0.95); z-index: 10; text-align: center; padding: 20px; }
        .video-item { background: #1e293b; padding: 12px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #3b82f6; }
        .video-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px; font-size: 14px; }
        .delete-btn { background: #ef4444; padding: 6px 12px; border-radius: 5px; cursor: pointer; margin-left: 10px; border: none; color: white; }
        .play-btn { background: #10b981; padding: 6px 15px; border-radius: 5px; border: none; color: white; cursor: pointer; }
        .hidden { display: none!important; }
        #counter { text-align: center; font-size: 1.2em; margin-bottom: 15px; color: #60a5fa; font-weight: bold; }
        .platform-badge { font-size: 10px; background: #475569; padding: 2px 6px; border-radius: 4px; margin-left: 5px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container" id="loginGate">
    <h2 style="text-align:center;">Enterprise Player Access</h2>
    <button onclick="googleLogin()">Secure Login with Google</button>
</div>

<div class="container hidden" id="playerSection">
    <div id="counter">Vault Quota: 0 / 50</div>
    
    <div id="playerContainer">
        <!-- Dynamic Frame Injector -->
        <div id="videoFrameWrapper">
            <div id="mainPlayer"></div>
        </div>
        
        <div id="errorOverlay">
            <p style="color:#ef4444; font-size: 18px; margin-bottom: 5px;"><strong>Embed Restricted</strong></p>
            <p style="font-size:12px; color:#cbd5e1; margin-bottom: 15px;">Creator disabled embedding or content requires membership.</p>
            <a id="instaLink" href="#" target="_blank" style="text-decoration:none; color:white; background:#3b82f6; padding:10px 20px; border-radius:5px; font-weight: bold;">Open on Original App</a>
        </div>
    </div>

    <input type="text" id="title" placeholder="Video Title (e.g., Podcast Ep 1)">
    <input type="text" id="url" placeholder="Paste YouTube, Instagram, or Facebook URL">
    <button onclick="pushLink()">Archive Video</button>
    
    <div id="videoList" style="margin-top: 25px;"></div>
    <br>
    <button onclick="logoutUser()" style="background:#ef4444;">Terminate Session (Logout)</button>
</div>

<script>
    // FIREBASE INITIALIZATION
    const firebaseConfig = {
        apiKey: "AIzaSyDg-_--DQoINvqsMOAYfbwEnDyvMgH88-w",
        authDomain: "zing-arena.firebaseapp.com",
        databaseURL: "https://zing-arena-default-rtdb.firebaseio.com",
        projectId: "zing-arena",
        storageBucket: "zing-arena.firebasestorage.app",
        messagingSenderId: "749170646467",
        appId: "1:749170646467:web:1d279de6a84a0340bcf176"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    function googleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then(() => {
            window.location.href = "zingarena://login-success";
        }).catch(err => alert("Authentication Failed: " + err.message));
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('loginGate').classList.add('hidden');
            document.getElementById('playerSection').classList.remove('hidden');
            loadData(user.uid);
        } else {
            document.getElementById('loginGate').classList.remove('hidden');
            document.getElementById('playerSection').classList.add('hidden');
        }
    });

    function logoutUser() {
        auth.signOut().then(() => {
            window.location.href = "zingarena://logout";
        });
    }

    // MULTI-PLATFORM LINK PROCESSOR
    function pushLink() {
        const userId = auth.currentUser.uid;
        const dbRef = db.ref('users/' + userId + '/playlist/');

        dbRef.once('value', snapshot => {
            if(snapshot.numChildren() >= 50) {
                alert("Storage Cap (50) reached. Delete existing records.");
                return;
            }

            const title = document.getElementById('title').value.trim();
            const url = document.getElementById('url').value.trim();
            if(!title || !url) return alert("System requires both Title and URL.");

            let embedUrl = url;
            let rawUrl = url;
            let platformType = "external"; 

            // YouTube Logic
            if (url.includes("youtube.com") || url.includes("youtu.be")) {
                platformType = "youtube";
                let v = url.split(/(vi\/|v=|\/v\/|youtu\.be\/|\/embed\/|\/shorts\/)/);
                let id = (v[2] !== undefined) ? v[2].split(/[^0-9a-z_-]/i)[0] : url;
                embedUrl = "https://www.youtube.com/embed/" + id + "?rel=0";
            } 
            // Instagram Logic (Auto-convert to embed URL)
            else if (url.includes("instagram.com")) {
                platformType = "instagram";
                if(!url.includes("/embed")) {
                    embedUrl = url.split('?')[0]; // Remove query params
                    if(!embedUrl.endsWith('/')) embedUrl += '/';
                    embedUrl += "embed/";
                }
            }
            // Facebook Logic (Auto-convert to official plugin)
            else if (url.includes("facebook.com") || url.includes("fb.watch")) {
                platformType = "facebook";
                embedUrl = `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false&width=500`;
            }

            dbRef.push({ title, url: embedUrl, rawUrl: rawUrl, platform: platformType });
            document.getElementById('title').value = "";
            document.getElementById('url').value = "";
        });
    }

    // ADVANCED PLAYBACK ENGINE (FIXED RACE CONDITION)
    let ytPlayer = null;

    function playVideo(url, rawUrl, platform) {
        document.getElementById('playerContainer').style.display = "block";
        document.getElementById('errorOverlay').style.display = "none";
        document.getElementById('instaLink').href = rawUrl;

        // VITAL FIX: Completely reset the DOM element to kill ghost iframes/cache
        const wrapper = document.getElementById('videoFrameWrapper');
        wrapper.innerHTML = '<div id="mainPlayer"></div>';

        // Set default platform to youtube for backward compatibility with old data
        platform = platform || "youtube"; 

        if (platform === "youtube") {
            let videoId = "";
            try {
                videoId = url.split('/embed/')[1].split('?')[0];
            } catch(e) {
                videoId = url; // Fallback if format is different
            }

            if (typeof YT !== 'undefined' && YT.Player) {
                ytPlayer = new YT.Player('mainPlayer', {
                    videoId: videoId,
                    playerVars: { 'autoplay': 1, 'rel': 0 },
                    events: {
                        'onReady': function(event) {
                            event.target.playVideo();
                        },
                        'onError': function(event) {
                            // 101/150: Blocked by creator (Members only/No-embed)
                            // 2: Invalid ID, 153: Domain restriction
                            if ([2, 101, 150, 153].includes(event.data)) {
                                document.getElementById('errorOverlay').style.display = "flex";
                            }
                        }
                    }
                });
            } else {
                alert("YouTube core API is initializing. Please click play again in 1 second.");
            }
        } 
        else {
            // Instagram, Facebook & External fallback
            wrapper.innerHTML = `<iframe id="mainPlayer" src="${url}" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; picture-in-picture" scrolling="no"></iframe>`;
            
            // For Insta/FB, if they block it entirely, there is no official API error code. 
            // The browser just refuses to connect. We provide the overlay manually if it fails completely.
            document.getElementById('mainPlayer').onerror = function() {
                document.getElementById('errorOverlay').style.display = "flex";
            };
        }
    }

    // DATABASE RENDERER
    function loadData(uid) {
        db.ref('users/' + uid + '/playlist/').on('value', snapshot => {
            const list = document.getElementById('videoList');
            list.innerHTML = "";
            document.getElementById('counter').innerText = `Vault Quota: ${snapshot.numChildren()} / 50`;
            
            snapshot.forEach(child => {
                const data = child.val();
                const plt = data.platform ? data.platform : 'youtube'; // backward compatibility
                
                let pltColor = plt === 'youtube' ? '#ef4444' : plt === 'instagram' ? '#e1306c' : plt === 'facebook' ? '#1877f2' : '#64748b';

                list.innerHTML += `
                <div class="video-item">
                    <div class="video-title">
                        ${data.title}
                        <span class="platform-badge" style="background:${pltColor}">${plt}</span>
                    </div>
                    <div>
                        <button class="play-btn" onclick="playVideo('${data.url}', '${data.rawUrl}', '${plt}')">Play</button>
                        <button class="delete-btn" onclick="db.ref('users/${uid}/playlist/${child.key}').remove()">X</button>
                    </div>
                </div>`;
            });
        });
    }
</script>
</body>
</html>
