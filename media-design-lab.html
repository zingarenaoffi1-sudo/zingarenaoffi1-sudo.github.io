<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media & Design Lab - Zing Arena</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f172a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h2 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        p {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 30px;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .tool-card {
            background: #1e293b;
            padding: 30px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid #334155;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            text-decoration: none;
        }
        .tool-card span {
            display: block;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .tool-card:hover {
            background: #3b82f6;
            transform: translateY(-6px);
            border-color: #60a5fa;
        }
        .back-btn {
            display: inline-block;
            margin-top: 40px;
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 12px 25px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎨 Media & Design Lab</h2>
        <p>Advanced photo editing, compression, and screen recording suite</p>

        <div class="tools-grid">
            <a href="tools/PhotoStudioPro.html" class="tool-card">
                <span>🖼️</span> PhotoStudio Pro
            </a>
            <a href="tools/image-compressor.html" class="tool-card">
                <span>▼</span> Image Compressor
            </a>
            <a href="tools/WebStudioPro.html" class="tool-card">
                <span>●</span> Screen Recorder Pro
            </a>
            <a href="tools/color-picker.html" class="tool-card">
                <span>🎨</span> Color Picker
            </a>
        </div>

        <a href="index.html" class="back-btn">← Back to Dashboard</a>
    </div>

</body>
</html>
