<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Engine | Zing Arena</title>
    <style>
        body { 
            background: #0f172a; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        select { 
            padding: 10px; 
            border-radius: 6px; 
            background: #1e293b; 
            color: white; 
            border: 1px solid #3b82f6; 
            font-size: 16px;
            outline: none;
            cursor: pointer;
        }
        button { 
            padding: 10px 20px; 
            border-radius: 6px; 
            border: none; 
            background: #3b82f6; 
            color: white; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { background: #475569; cursor: not-allowed; }
        .back-btn { background: #ef4444; margin-top: 20px;}
        
        textarea { 
            width: 100%; 
            height: 250px; 
            background: #1e293b; 
            color: #10b981; 
            border: 2px solid #334155; 
            border-radius: 8px;
            padding: 15px; 
            font-family: monospace; 
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            resize: vertical;
        }
        .output-box { 
            width: 100%; 
            background: #000; 
            color: #e2e8f0; 
            padding: 15px; 
            min-height: 120px; 
            text-align: left;
            white-space: pre-wrap; 
            font-family: monospace; 
            border: 1px solid #334155;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 15px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚙️ Logic Engine</h2>
        
        <div class="header-box">
            <select id="language">
                <!-- Paiza API ke liye values -->
                <option value="python">Python 3</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
            </select>
            <button onclick="runCode()" id="runBtn">Run Code ⚡</button>
        </div>

        <textarea id="sourceCode" placeholder="Write your logic here...
Example: print('Hello from Zing Arena!')"></textarea>
        
        <div class="output-box" id="outputArea">Output will appear here...</div>
        
        <button onclick="window.location.href='coderunner.html'" class="back-btn">Back to Suite</button>
    </div>

    <script>
        // Paiza ke language codes
        const langMap = {
            "python": "python3",
            "java": "java",
            "cpp": "cpp"
        };

        async function runCode() {
            const lang = document.getElementById("language").value;
            const paizaLang = langMap[lang];
            const code = document.getElementById("sourceCode").value;
            const outArea = document.getElementById("outputArea");
            const btn = document.getElementById("runBtn");

            if(!code.trim()) {
                outArea.style.color = "#e2e8f0";
                outArea.innerText = "Please write some code first!";
                return;
            }

            btn.innerText = "Running...";
            btn.disabled = true;
            outArea.style.color = "#fbbf24";
            outArea.innerText = " connecting to server... 🚀";

            try {
                // Step 1: Sending request through CORS Proxy
                const createUrl = "https://corsproxy.io/?" + encodeURIComponent("https://api.paiza.io/runners/create");
                
                const createRes = await fetch(createUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        source_code: code,
                        language: paizaLang,
                        api_key: "guest"
                    })
                });
                
                const createData = await createRes.json();
                
                if(createData.error) {
                    throw new Error(createData.error);
                }

                const runId = createData.id;
                outArea.innerText = "Executing Code... ⏳ (Please wait 1-2 seconds)";
                
                // Step 2: Waiting for the result
                let checkData;
                for(let i = 0; i < 15; i++) { // Max 15 loop checks
                    await new Promise(resolve => setTimeout(resolve, 1000)); // 1 second gap
                    
                    const checkUrl = "https://corsproxy.io/?" + encodeURIComponent(`https://api.paiza.io/runners/get_details?id=${runId}&api_key=guest`);
                    const checkRes = await fetch(checkUrl);
                    checkData = await checkRes.json();
                    
                    if(checkData.status === "completed") {
                        break;
                    }
                }

                // Step 3: Printing the Output
                outArea.style.color = "#e2e8f0"; 
                
                if (checkData.build_result === "failure") {
                    outArea.style.color = "#ef4444"; 
                    outArea.innerText = "Build Error:\n" + checkData.build_stderr;
                } else if (checkData.stderr) {
                    outArea.style.color = "#ef4444"; 
                    outArea.innerText = "Error:\n" + checkData.stderr;
                } else {
                    outArea.innerText = checkData.stdout || "Code Executed Successfully! (No output printed)";
                }

            } catch(e) {
                outArea.style.color = "#ef4444";
                outArea.innerText = "Network Error! Please try running it again.\nSystem Details: " + e.message;
            }
            
            btn.innerText = "Run Code ⚡";
            btn.disabled = false;
        }
    </script>
</body>
</html>
