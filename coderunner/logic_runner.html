<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Engine | Zing Arena</title>
    <style>
        body { 
            background: #0f172a; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        select { 
            padding: 10px; 
            border-radius: 6px; 
            background: #1e293b; 
            color: white; 
            border: 1px solid #3b82f6; 
            font-size: 16px;
            outline: none;
            cursor: pointer;
        }
        button { 
            padding: 10px 20px; 
            border-radius: 6px; 
            border: none; 
            background: #3b82f6; 
            color: white; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { background: #475569; cursor: not-allowed; }
        .back-btn { background: #ef4444; margin-top: 20px;}
        
        textarea { 
            width: 100%; 
            height: 250px; 
            background: #1e293b; 
            color: #10b981; 
            border: 2px solid #334155; 
            border-radius: 8px;
            padding: 15px; 
            font-family: monospace; 
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            resize: vertical;
        }
        .output-box { 
            width: 100%; 
            background: #000; 
            color: #e2e8f0; 
            padding: 15px; 
            min-height: 120px; 
            text-align: left;
            white-space: pre-wrap; 
            font-family: monospace; 
            border: 1px solid #334155;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 15px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚙️ Logic Engine</h2>
        
        <div class="header-box">
            <select id="language">
                <!-- CodeX API ke liye short codes: py, java, cpp -->
                <option value="py">Python 3</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
            </select>
            <button onclick="runCode()" id="runBtn">Run Code ⚡</button>
        </div>

        <textarea id="sourceCode" placeholder="Write your logic here...
Example: print('Hello from Zing Arena!')"></textarea>
        
        <div class="output-box" id="outputArea">Output will appear here...</div>
        
        <button onclick="window.location.href='coderunner.html'" class="back-btn">Back to Suite</button>
    </div>

    <script>
        async function runCode() {
            const lang = document.getElementById("language").value;
            const code = document.getElementById("sourceCode").value;
            const outArea = document.getElementById("outputArea");
            const btn = document.getElementById("runBtn");

            // Agar code empty hai toh rok do
            if(!code.trim()) {
                outArea.style.color = "#e2e8f0";
                outArea.innerText = "Please write some code first!";
                return;
            }

            // Button ko disable aur loading state mein daalo (Taki double click na ho)
            btn.innerText = "Running...";
            btn.disabled = true;
            outArea.style.color = "#fbbf24"; // Yellow loading color
            outArea.innerText = "Connecting to CodeX Server... 🚀";

            // URL-encoded form data banane ka tareeka (Browser CORS block nahi karta isse)
            const formData = new URLSearchParams();
            formData.append("code", code);
            formData.append("language", lang);
            formData.append("input", ""); // Agar aage chal kar user input ka feature daalna ho

            try {
                // CodeX Open API - Special for Web Devs
                const response = await fetch("https://api.codex.jaagrav.in", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: formData
                });
                
                const result = await response.json();
                
                // Output ko screen par dikhana
                if (result.error && result.error.trim() !== "") {
                    // Agar syntax error ya koi aur error hai
                    outArea.style.color = "#ef4444"; // Red for Error
                    outArea.innerText = "ERROR:\n" + result.error;
                } else if (result.output) {
                    // Agar code successfully chal gaya
                    outArea.style.color = "#e2e8f0"; // White for Success Output
                    outArea.innerText = result.output;
            } else {
    outArea.style.color = "#fbbf24"; // Yellow alert
    outArea.innerText = "Debug Mode - API ne yeh bheja hai:\n" + JSON.stringify(result, null, 2);
}             
            
            } catch(e) {
                // Agar internet chala jaye ya server down ho
                outArea.style.color = "#ef4444";
                outArea.innerText = "Connection Failed! Please check your internet connection and try again.";
                console.error("API Error: ", e);
            }
            
            // Button wapas normal state mein
            btn.innerText = "Run Code ⚡";
            btn.disabled = false;
        }
    </script>
</body>
</html>
