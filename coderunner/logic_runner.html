<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logic Engine | Zing Arena</title>
    <style>
        body { 
            background: #0f172a; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        select { 
            padding: 10px; 
            border-radius: 6px; 
            background: #1e293b; 
            color: white; 
            border: 1px solid #3b82f6; 
            font-size: 16px;
            outline: none;
        }
        button { 
            padding: 10px 20px; 
            border-radius: 6px; 
            border: none; 
            background: #3b82f6; 
            color: white; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        .back-btn { background: #ef4444; margin-top: 20px;}
        
        textarea { 
            width: 100%; 
            height: 250px; 
            background: #1e293b; 
            color: #10b981; 
            border: 2px solid #334155; 
            border-radius: 8px;
            padding: 15px; 
            font-family: monospace; 
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            resize: vertical;
        }
        .output-box { 
            width: 100%; 
            background: #000; 
            color: #e2e8f0; 
            padding: 15px; 
            min-height: 120px; 
            text-align: left;
            white-space: pre-wrap; 
            font-family: monospace; 
            border: 1px solid #334155;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚙️ Logic Engine</h2>
        
        <div class="header-box">
            <select id="language">
                <option value="python">Python 3</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
            </select>
            <button onclick="runCode()" id="runBtn">Run Code ⚡</button>
        </div>

        <textarea id="sourceCode" placeholder="Write your logic here...
Example: print('Hello from Zing Arena!')"></textarea>
        
        <div class="output-box" id="outputArea">Output will appear here...</div>
        
        <button onclick="window.location.href='coderunner.html'" class="back-btn">Back to Suite</button>
    </div>

    <script>
        // API ke liye languages ke basic versions
        const versions = {
            "python": "3.10.0",
            "java": "15.0.2",
            "cpp": "10.2.0"
        };

        async function runCode() {
            const lang = document.getElementById("language").value;
            const code = document.getElementById("sourceCode").value;
            const outArea = document.getElementById("outputArea");
            const btn = document.getElementById("runBtn");

            // Agar code khali hai toh kuch mat karo
            if(!code.trim()) {
                outArea.innerText = "Please write some code first!";
                return;
            }

            btn.innerText = "Running...";
            outArea.style.color = "#fbbf24"; // Yellow loading color
            outArea.innerText = "Compiling on Cloud Server...";

            try {
                // Free Piston API ko request bhejna
                const response = await fetch("https://emkc.org/api/v2/piston/execute", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        language: lang,
                        version: versions[lang],
                        files: [{ content: code }]
                    })
                });
                
                const result = await response.json();
                
                // Result handle karna
                outArea.style.color = "#e2e8f0"; // Wapas normal color
                if(result.run && result.run.stdout) {
                    outArea.innerText = result.run.stdout;
                } else if (result.run && result.run.stderr) {
                    outArea.style.color = "#ef4444"; // Error ke liye red color
                    outArea.innerText = "ERROR:\n" + result.run.stderr;
                } else {
                    outArea.innerText = result.message || "Compilation failed. Check your syntax.";
                }
            } catch(e) {
                outArea.style.color = "#ef4444";
                outArea.innerText = "Network Error! Server offline hai ya internet slow hai.";
            }
            
            btn.innerText = "Run Code ⚡";
        }
    </script>
</body>
</html>
