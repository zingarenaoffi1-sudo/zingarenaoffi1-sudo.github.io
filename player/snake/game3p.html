<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes & Ladders Pro - 3 Players</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a252f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .game-wrapper {
            background-color: #2c3e50;
            width: 400px;
            height: 650px;
            border-radius: 20px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 15px;
            box-sizing: border-box;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .title {
            font-size: 16px;
            font-weight: bold;
            color: #f1c40f;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .menu-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .menu-btn:hover { background-color: #c0392b; }
        
        .identity-badge {
            width: 100%;
            padding: 6px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .hidden { display: none !important; }

        .players-bar {
            width: 100%;
            display: flex;
            justify-content: space-between; /* 3 players fit better like this */
            margin-bottom: 8px;
            gap: 5px;
        }
        .player-profile {
            background: rgba(0,0,0,0.3);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 10px; /* Smaller font to fit 3 */
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            flex: 1;
            justify-content: center;
        }

        #board-container {
            width: 360px;
            height: 360px;
            background-size: cover;
            background-position: center;
            position: relative;
            border: 3px solid #f1c40f;
            border-radius: 8px;
            background-color: #34495e;
        }

        .pawn {
            width: 20px; /* Slightly smaller */
            height: 26px;
            position: absolute;
            transition: transform 0.3s ease-in-out;
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
        }
        /* SVG Pawn icons with colors */
        #pawn-red { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23e74c3c"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>'); }
        #pawn-green { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232ecc71"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>'); }
        #pawn-blue { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%233498db"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>'); }

        .footer-controls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 10px 15px;
            border-radius: 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }
        .turn-indicator {
            font-size: 14px;
            font-weight: bold;
        }
        /* Turn text colors */
        .red-text { color: #e74c3c; }
        .green-text { color: #2ecc71; }
        .blue-text { color: #3498db; }

        .dice-box {
            background: white;
            color: #111;
            width: 45px;
            height: 45px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none;
        }
        .dice-box:active { transform: scale(0.95); }
        .rolling { animation: shake 0.3s infinite; }
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
        
        .map-tag {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0,0,0,0.7);
            color: #f1c40f;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header">
            <div class="title">🐍 Snakes & Ladders Pro</div>
            <button class="menu-btn" onclick="window.location.href='index.html'">Menu</button>
        </div>

        <div id="my-identity-badge" class="identity-badge hidden">YOU ARE: RED</div>

        <div class="players-bar">
            <div id="profile-red" class="player-profile">🔴 P1 (Red)</div>
            <div id="profile-green" class="player-profile">🟢 P2 (Green)</div>
            <div id="profile-blue" class="player-profile">🔵 P3 (Blue)</div>
        </div>

        <div id="board-container">
            <div id="map-name" class="map-tag">Map: BOARD1</div>
            <!-- Pawns for 3 players -->
            <div id="pawn-red" class="pawn"></div>
            <div id="pawn-green" class="pawn"></div>
            <div id="pawn-blue" class="pawn"></div>
        </div>

        <div class="footer-controls">
            <div>
                <div id="turn-text" class="turn-indicator red-text">RED'S TURN</div>
                <div id="timer-text" style="font-size: 11px; color: #bdc3c7;">⏳ Time left: 25s</div>
            </div>
            <div id="dice-container" class="dice-box" title="Click to Roll Dice">⚀</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script3p.js"></script>
</body>
</html>
