<!-- ==========================================================================
     FEATURE 1: SPEECH TO TEXT NOTE MAKER (VOICEPAD PRO - MAX UPGRADE)
     All-in-One: HTML + CSS + JS Merged (18+ Languages, .TXT Export & Stats)
     ========================================================================== -->

<div class="voicepad-pro-container">
  <div class="tool-header">
    <span class="tool-badge">[ 🎙️ VoicePad Pro ]</span>
    <h3>Speech to Text Note Maker</h3>
  </div>
  
  <div class="control-row">
    <label for="sttLangSelect">Select Spoken Language:</label>
    <select id="sttLangSelect" class="lang-select">
      <!-- Indian Languages -->
      <option value="en-IN" selected>English (India)</option>
      <option value="hi-IN">Hindi - भारत (हिंदी)</option>
      <option value="bn-IN">Bengali (বাংলা)</option>
      <option value="ta-IN">Tamil (தமிழ்)</option>
      <option value="te-IN">Telugu (తెలుగు)</option>
      <option value="mr-IN">Marathi (मराठी)</option>
      <option value="gu-IN">Gujarati (ગુજરાતી)</option>
      <option value="ur-IN">Urdu (اردو)</option>
      <!-- International Languages -->
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="es-ES">Spanish (Español)</option>
      <option value="fr-FR">French (Français)</option>
      <option value="de-DE">German (Deutsch)</option>
      <option value="ja-JP">Japanese (日本語)</option>
      <option value="ko-KR">Korean (한국어)</option>
      <option value="ru-RU">Russian (Русский)</option>
      <option value="ar-SA">Arabic (العربية)</option>
      <option value="it-IT">Italian (Italiano)</option>
      <option value="pt-BR">Portuguese (Português)</option>
    </select>
  </div>

  <textarea id="sttOutputBox" class="text-box" placeholder="Click 'Start Microphone' and speak clearly into your device..." rows="6" oninput="updateTextStats()"></textarea>

  <!-- Live Word & Character Counter Bar -->
  <div class="stats-bar">
    <span>Words: <strong id="wordCount">0</strong></span>
    <span>Characters: <strong id="charCount">0</strong></span>
  </div>

  <div class="button-group">
    <button id="startSttBtn" class="btn btn-primary" onclick="startSpeechRecognition()">🎤 Start Microphone</button>
    <button id="stopSttBtn" class="btn btn-danger" onclick="stopSpeechRecognition()" disabled>⏹️ Stop</button>
    <button class="btn btn-secondary" onclick="copyRecognizedText()">📋 Copy Text</button>
    <button class="btn btn-success" onclick="downloadTextFile()">💾 Save as .TXT</button>
    <button class="btn btn-outline" onclick="clearRecognizedText()">🗑️ Clear</button>
  </div>

  <p id="sttStatusText" class="status-text">Status: Ready</p>
</div>

<!-- ================= STYLE (CSS) ================= -->

    margin: 20px auto;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

  }
  .voicepad-pro-container .tool-header {
    display: flex;
    align-items: center;

    margin-bottom: 16px;
  }
  .voicepad-pro-container .tool-badge {
    background: #eef6ff;
    color: #0066cc;
    font-size: 13px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 4px;

    font-size: 19px;

  }
  .voicepad-pro-container .control-row {
    margin-bottom: 14px;
    font-size: 14px;
    color: #444;
  }
  .voicepad-pro-container .lang-select {
    padding: 8px 12px;
    border: 1px solid #ccc;

    margin-left: 8px;

  .voicepad-pro-container .text-box {

  }
  .voicepad-pro-container .stats-bar {
    display: flex;
    justify-content: flex-end;

</style>

<!-- ================= SCRIPT (JS) ================= -->
<script>
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognitionEngine = null;
  let isListening = false;

  if (SpeechRecognitionAPI) {
    recognitionEngine = new SpeechRecognitionAPI();
    recognitionEngine.continuous = true;
    recognitionEngine.interimResults = true;
  }

  function startSpeechRecognition() {
    if (!recognitionEngine) {
      alert("Speech recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
      return;
    }

    const selectedLang = document.getElementById("sttLangSelect").value;
    recognitionEngine.lang = selectedLang;

    try {
      recognitionEngine.start();
      isListening = true;
      document.getElementById("startSttBtn").disabled = true;
      document.getElementById("stopSttBtn").disabled = false;
      document.getElementById("sttStatusText").innerText = "Status: Microphone active. Listening for speech...";
    } catch (e) {
      console.warn("Recognition already running:", e);
    }

    recognitionEngine.onresult = (event) => {
      let finalTranscript = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        finalTranscript += event.results[i][0].transcript;
      }
      
      const textBox = document.getElementById("sttOutputBox");
      // Append new text to existing text if needed, or update dynamically
      textBox.value = finalTranscript;
      updateTextStats();
    };

    recognitionEngine.onerror = (event) => {
      console.error("Speech Recognition Error:", event.error);
      document.getElementById("sttStatusText").innerText = "Status: Recognition error (" + event.error + "). Please check microphone permissions.";
      resetSpeechButtons();
    };

    recognitionEngine.onend = () => {
      if (isListening) {
        // Auto-restart if browser stops recognition silently
        try { recognitionEngine.start(); } catch(e) {}
      } else {
        resetSpeechButtons();
      }
    };
  }

  function stopSpeechRecognition() {
    isListening = false;
    if (recognitionEngine) {
      recognitionEngine.stop();
    }
    resetSpeechButtons();
    document.getElementById("sttStatusText").innerText = "Status: Microphone paused.";
  }

  function resetSpeechButtons() {
    document.getElementById("startSttBtn").disabled = false;
    document.getElementById("stopSttBtn").disabled = true;
  }

  function copyRecognizedText() {
    const textBox = document.getElementById("sttOutputBox");
    if (!textBox.value.trim()) {
      alert("No text available to copy.");
      return;
    }
    textBox.select();
    document.execCommand("copy");
    alert("Text successfully copied to clipboard.");
  }

  function downloadTextFile() {
    const textContent = document.getElementById("sttOutputBox").value.trim();
    if (!textContent) {
      alert("No text available to save. Please speak or type some notes first.");
      return;
    }
    const blob = new Blob([textContent], { type: "text/plain;charset=utf-8" });
    const downloadLink = document.createElement("a");
    downloadLink.href = URL.createObjectURL(blob);
    downloadLink.download = "VoicePad_Notes_" + new Date().toISOString().slice(0, 10) + ".txt";
    downloadLink.click();
    document.getElementById("sttStatusText").innerText = "Status: Note saved as TXT file successfully.";
  }

  function clearRecognizedText() {
    document.getElementById("sttOutputBox").value = "";
    updateTextStats();
    document.getElementById("sttStatusText").innerText = "Status: Text cleared. Ready.";
  }

  function updateTextStats() {
    const text = document.getElementById("sttOutputBox").value.trim();
    const charCount = text.length;
    const wordCount = text === "" ? 0 : text.split(/\s+/).length;
    
    document.getElementById("charCount").innerText = charCount;
    document.getElementById("wordCount").innerText = wordCount;
  }
</script>
