<!-- ==========================================================================
     FEATURE: LIVE MARKDOWN & README FORMATTER (DOC MAKER PRO - FIXED EDITION)
     All-in-One: HTML + CSS + JS Merged (100% Professional Standard English)
     ========================================================================== -->

<div class="docmaker-container">
  <div class="tool-header">
    <span class="tool-badge">[ 📝 DocMaker Pro ]</span>
    <h3>Live Markdown & Readme Formatter</h3>
  </div>

  <!-- Quick Formatting Toolbar -->
  <div class="toolbar">
    <button type="button" onclick="insertSyntax('bold')" title="Bold (Ctrl+B)"><b>B</b></button>
    <button type="button" onclick="insertSyntax('italic')" title="Italic (Ctrl+I)"><i>I</i></button>
    <button type="button" onclick="insertSyntax('heading')" title="Heading 1"><b>H1</b></button>
    <button type="button" onclick="insertSyntax('code')" title="Code Block">&lt;/&gt;</button>
    <button type="button" onclick="insertSyntax('list')" title="Bullet List">• List</button>
    <button type="button" onclick="insertSyntax('link')" title="Insert Link">🔗 Link</button>
    <button type="button" class="btn-sample" onclick="loadSampleTemplate()" title="Load demo markdown">💡 Load Sample</button>
  </div>

  <!-- Split Workspace: Input on Left, Live Preview on Right -->
  <div class="workspace-grid">
    <div class="editor-pane">
      <label class="pane-label">Markdown Input:</label>
      <textarea id="markdownInput" class="markdown-editor" placeholder="Start typing your Markdown here (e.g., # Project Title)..." oninput="renderMarkdown()"></textarea>
    </div>

    <div class="preview-pane">
      <label class="pane-label">Live Document Preview:</label>
      <div id="markdownPreview" class="markdown-preview">
        <div class="empty-state-text">📄 Live document preview will appear here as you type...</div>
      </div>
    </div>
  </div>

  <!-- Stats & Status Bar -->
  <div class="status-bar">
    <span id="docStats" class="stats-text">Words: 0 | Characters: 0</span>
    <span id="docStatus" class="status-text">Status: Ready</span>
  </div>

  <!-- Action Buttons -->
  <div class="button-group">
    <button class="btn btn-primary" onclick="copyRawMarkdown()">📋 Copy Markdown</button>
    <button class="btn btn-secondary" onclick="copyFormattedHTML()">📑 Copy Formatted HTML</button>
    <button class="btn btn-success" onclick="downloadMarkdownFile()">💾 Save as .MD File</button>
    <button class="btn btn-outline" onclick="clearDocument()">🗑️ Clear Document</button>
  </div>
</div>

<!-- Industry-standard Lightweight Markdown Parser (Marked.js) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- ================= SCRIPT (JS) ================= -->
<script>
  function renderMarkdown() {
    const rawText = document.getElementById("markdownInput").value;
    const previewBox = document.getElementById("markdownPreview");
    
    if (!rawText.trim()) {
      previewBox.innerHTML = '<div class="empty-state-text">📄 Live document preview will appear here as you type...</div>';
    } else if (typeof marked !== "undefined") {
      previewBox.innerHTML = marked.parse(rawText);
    } else {
      previewBox.innerHTML = "<p>Error: Unable to load Markdown parser library.</p>";
    }

    updateStats(rawText);
  }

  function insertSyntax(type) {
    const textarea = document.getElementById("markdownInput");
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const selectedText = textarea.value.substring(start, end);
    let replacement = "";
    let cursorOffset = 0;

    // Smart syntax insertion without dummy words
    switch (type) {
      case "bold":
        if (selectedText) {
          replacement = `**${selectedText}**`;
          cursorOffset = replacement.length;
        } else {
          replacement = `****`;
          cursorOffset = 2; // Places blinking cursor inside **|**
        }
        break;
      case "italic":
        if (selectedText) {
          replacement = `*${selectedText}*`;
          cursorOffset = replacement.length;
        } else {
          replacement = `**`;
          cursorOffset = 1; // Places blinking cursor inside *|*
        }
        break;
      case "heading":
        replacement = `# ${selectedText}`;
        cursorOffset = replacement.length;
        break;
      case "code":
        if (selectedText) {
          replacement = `\n\`\`\`\n${selectedText}\n\`\`\`\n`;
          cursorOffset = replacement.length;
        } else {
          replacement = `\n\`\`\`\n\n\`\`\`\n`;
          cursorOffset = 5; // Places cursor inside code block
        }
        break;
      case "list":
        replacement = `\n* ${selectedText}`;
        cursorOffset = replacement.length;
        break;
      case "link":
        if (selectedText) {
          replacement = `[${selectedText}](https://example.com)`;
          cursorOffset = replacement.length;
        } else {
          replacement = `[](https://example.com)`;
          cursorOffset = 1; // Places cursor inside []
        }
        break;
    }

    // Insert text and move cursor to exact correct typing position
    textarea.setRangeText(replacement, start, end, "end");
    textarea.selectionStart = start + cursorOffset;
    textarea.selectionEnd = start + cursorOffset;
    textarea.focus();
    renderMarkdown();
  }

  function loadSampleTemplate() {
    const sample = `# Welcome to DocMaker Pro 🚀

An executive **Markdown & Readme Formatter** built for high-performance workflow.

## Key Features
* **Live Rendering:** View instant formatting changes.
* **100% Local Processing:** Runs smoothly without server lag.
* **Code Blocks Support:**
\`\`\`javascript
function launchApp() {
  console.log("Zing Arena Studio Ready!");
}
\`\`\`

> *Type on the left to start formatting your document.*`;

    document.getElementById("markdownInput").value = sample;
    renderMarkdown();
    document.getElementById("docStatus").innerText = "Status: Sample template loaded.";
  }

  function copyRawMarkdown() {
    const rawText = document.getElementById("markdownInput").value.trim();
    if (!rawText) {
      alert("No Markdown text available to copy.");
      return;
    }
    navigator.clipboard.writeText(rawText)
      .then(() => alert("Raw Markdown text copied to clipboard successfully."))
      .catch(() => alert("Unable to copy text automatically."));
  }

  function copyFormattedHTML() {
    const formattedHTML = document.getElementById("markdownPreview").innerHTML;
    const rawText = document.getElementById("markdownInput").value.trim();
    if (!rawText) {
      alert("No formatted content available to copy.");
      return;
    }
    navigator.clipboard.writeText(formattedHTML)
      .then(() => alert("Formatted HTML code copied to clipboard successfully."))
      .catch(() => alert("Unable to copy HTML automatically."));
  }

  function downloadMarkdownFile() {
    const rawText = document.getElementById("markdownInput").value.trim();
    if (!rawText) {
      alert("No content available to save. Please type your document first.");
      return;
    }
    const fileName = "README_" + new Date().toISOString().slice(0, 10) + ".md";
    const blob = new Blob([rawText], { type: "text/markdown;charset=utf-8" });
    const downloadUrl = URL.createObjectURL(blob);

    const anchor = document.createElement("a");
    anchor.href = downloadUrl;
    anchor.download = fileName;
    document.body.appendChild(anchor);
    anchor.click();
    document.body.removeChild(anchor);

    document.getElementById("docStatus").innerText = "Status: Markdown file saved successfully.";
  }

  function clearDocument() {
    document.getElementById("markdownInput").value = "";
    renderMarkdown();
    document.getElementById("docStatus").innerText = "Status: Document cleared. Ready.";
  }

  function updateStats(text) {
    const charCount = text.length;
    const wordCount = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
    document.getElementById("docStats").innerText = `Words: ${wordCount} | Characters: ${charCount}`;
  }
</script>
