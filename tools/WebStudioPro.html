<!-- ==========================================================================
     FEATURE: IN-BROWSER SCREEN & AUDIO RECORDER (WITH DRAGGABLE FLOATING BADGE)
     All-in-One: HTML + CSS + JS Merged (100% Professional Standard English)
     ========================================================================== -->

<div class="webstudio-container">
  <div class="tool-header">
    <span class="tool-badge">[ 🎥 Web Studio Pro ]</span>
    <h3>Screen & Audio Recorder (Full Device Support)</h3>
  </div>

  <div class="control-row">
    <label for="recordingMode">Select Recording Mode:</label>
    <select id="recordingMode" class="mode-select" onchange="resetStudio()">
      <option value="screen">Entire Device Screen + Audio (`.webm`)</option>
      <option value="audio">Microphone Voice Only (`.webm`)</option>
    </select>
  </div>

  <!-- Live Preview & Playback Screen -->
  <div class="media-preview-box">
    <video id="previewPlayer" autoplay muted playsinline controls style="display: none;"></video>
    <div id="placeholderText" class="placeholder-text">
      <span>🖥️ Media Preview Window</span>
      <p>Click "Start Recording" and select "Entire Screen" to capture your whole device.</p>
    </div>
  </div>

  <!-- Recording Timer & Status Bar -->
  <div class="status-bar">
    <span id="recordingTimer" class="timer-display">00:00</span>
    <span id="studioStatus" class="status-text">Status: Ready to Record</span>
  </div>

  <div class="button-group">
    <button id="startRecBtn" class="btn btn-primary" onclick="startRecording()">🔴 Start Recording</button>
    <button id="stopRecBtn" class="btn btn-danger" onclick="stopRecording()" disabled>⏹️ Stop Recording</button>
    <button id="downloadRecBtn" class="btn btn-success" onclick="downloadRecording()" disabled>⬇️ Download File</button>
    <button class="btn btn-outline" onclick="resetStudio()">🗑️ Reset</button>
  </div>
</div>

<!-- ================= DRAGGABLE FLOATING CONTROL BADGE ================= -->
<div id="floatingBadge" class="floating-badge" style="display: none;">
  <div class="drag-handle" title="Drag to reposition">⠿</div>
  <span class="pulse-icon">🔴</span>
  <span id="floatTimer" class="float-timer">00:00</span>
  <button onclick="stopRecording()" class="float-stop-btn">⏹️ Stop</button>
</div>

<!-- ================= SCRIPT (JS) ================= -->
<script>
  let mediaRecorder = null;
  let recordedChunks = [];
  let mediaStream = null;
  let timerInterval = null;
  let secondsElapsed = 0;

  const previewPlayer = document.getElementById("previewPlayer");
  const placeholderText = document.getElementById("placeholderText");
  const timerDisplay = document.getElementById("recordingTimer");
  const floatTimer = document.getElementById("floatTimer");
  const statusText = document.getElementById("studioStatus");
  const startBtn = document.getElementById("startRecBtn");
  const stopBtn = document.getElementById("stopRecBtn");
  const downloadBtn = document.getElementById("downloadRecBtn");
  const floatingBadge = document.getElementById("floatingBadge");

  async function startRecording() {
    const mode = document.getElementById("recordingMode").value;
    recordedChunks = [];
    secondsElapsed = 0;

    if (!navigator.mediaDevices) {
      alert("Media recording is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
      return;
    }

    try {
      if (mode === "screen") {
        // Prompts user -> select 'Entire Screen' to record all apps
        mediaStream = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: "always" },
          audio: true
        });
      } else {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: false
        });
      }

      previewPlayer.srcObject = mediaStream;
      previewPlayer.muted = true;
      previewPlayer.style.display = "block";
      placeholderText.style.display = "none";

      mediaRecorder = new MediaRecorder(mediaStream);

      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = () => {
        handleRecordingStop();
      };

      mediaStream.getTracks().forEach(track => {
        track.onended = () => {
          if (mediaRecorder && mediaRecorder.state === "recording") {
            stopRecording();
          }
        };
      });

      mediaRecorder.start();
      startTimer();

      // Show Floating Draggable Control Badge
      floatingBadge.style.display = "flex";

      startBtn.disabled = true;
      stopBtn.disabled = false;
      downloadBtn.disabled = true;
      statusText.innerText = "Status: Recording active. Use floating badge to stop.";

    } catch (error) {
      console.warn("Recording permission canceled or denied:", error);
      statusText.innerText = "Status: Permission canceled by user.";
    }
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
    }
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
    }
    stopTimer();
    floatingBadge.style.display = "none";
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }

  function handleRecordingStop() {
    const mode = document.getElementById("recordingMode").value;
    const fileType = "video/webm";
    const recordedBlob = new Blob(recordedChunks, { type: fileType });
    const recordingUrl = URL.createObjectURL(recordedBlob);

    previewPlayer.srcObject = null;
    previewPlayer.src = recordingUrl;
    previewPlayer.muted = false;
    previewPlayer.controls = true;

    downloadBtn.disabled = false;
    statusText.innerText = "Status: Recording complete. Ready to download.";
  }

  function downloadRecording() {
    if (recordedChunks.length === 0) {
      alert("No recording available to download.");
      return;
    }

    const fileName = "ZingArena_Recording_" + new Date().toISOString().slice(0, 10) + ".webm";
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const downloadUrl = URL.createObjectURL(blob);

    const anchor = document.createElement("a");
    anchor.href = downloadUrl;
    anchor.download = fileName;
    document.body.appendChild(anchor);
    anchor.click();
    document.body.removeChild(anchor);

    statusText.innerText = "Status: File downloaded successfully.";
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, "0");
      const secs = String(secondsElapsed % 60).padStart(2, "0");
      timerDisplay.innerText = `${mins}:${secs}`;
      floatTimer.innerText = `${mins}:${secs}`;
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  function resetStudio() {
    stopRecording();
    secondsElapsed = 0;
    timerDisplay.innerText = "00:00";
    floatTimer.innerText = "00:00";
    recordedChunks = [];

    previewPlayer.srcObject = null;
    previewPlayer.src = "";
    previewPlayer.style.display = "none";
    placeholderText.style.display = "block";

    startBtn.disabled = false;
    stopBtn.disabled = true;
    downloadBtn.disabled = true;
    statusText.innerText = "Status: Ready to Record";
  }

  /* ==========================================================================
     DRAGGABLE FLOATING BADGE LOGIC (SUPPORTS BOTH MOUSE & TOUCH/MOBILE)
     ========================================================================== */
  let isDragging = false;
  let startX, startY, initialLeft, initialTop;

  floatingBadge.addEventListener("mousedown", startDrag);
  floatingBadge.addEventListener("touchstart", startDrag, { passive: false });

  document.addEventListener("mousemove", drag);
  document.addEventListener("touchmove", drag, { passive: false });

  document.addEventListener("mouseup", stopDrag);
  document.addEventListener("touchend", stopDrag);

  function startDrag(e) {
    // Only drag if not clicking the stop button directly
    if (e.target.tagName.toLowerCase() === "button") return;
    
    isDragging = true;
    const event = e.type === "touchstart" ? e.touches[0] : e;
    startX = event.clientX;
    startY = event.clientY;
    
    const rect = floatingBadge.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;

    floatingBadge.style.right = "auto";
    floatingBadge.style.bottom = "auto";
    floatingBadge.style.left = initialLeft + "px";
    floatingBadge.style.top = initialTop + "px";
  }

  function drag(e) {
    if (!isDragging) return;
    e.preventDefault();
    const event = e.type === "touchmove" ? e.touches[0] : e;
    const dx = event.clientX - startX;
    const dy = event.clientY - startY;

    floatingBadge.style.left = (initialLeft + dx) + "px";
    floatingBadge.style.top = (initialTop + dy) + "px";
  }

  function stopDrag() {
    isDragging = false;
  }
</script>
