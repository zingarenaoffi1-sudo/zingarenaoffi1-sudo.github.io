<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Merger - Zing Arena</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        .box { background: #1e293b; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
        input { margin: 20px 0; color: white; }
        button { padding: 12px 25px; background: #3b82f6; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #64748b; cursor: not-allowed; }
    </style>
</head>
<body>
    <h2>🔗 PDF Merger</h2>
    <div class="box">
        <input type="file" id="pdfInput" accept="application/pdf" multiple>
        <br>
        <button id="mergeBtn" onclick="mergePDFs()">Merge & Download</button>
        <p id="status"></p>
    </div>
    <br>
    <button onclick="window.history.back()" style="background: #ef4444;">Back to Dashboard</button>

    <script>
        async function mergePDFs() {
            const fileInput = document.getElementById('pdfInput');
            const status = document.getElementById('status');
            const btn = document.getElementById('mergeBtn');
            
            if (fileInput.files.length < 2) {
                alert("Bhai, kam se kam 2 PDF file select karo!");
                return;
            }

            status.innerText = "Merging... ruk jao bhai...";
            btn.disabled = true;

            try {
                // 1. pdf-lib ko initialize karna
                const { PDFDocument } = PDFLib;
                
                // 2. Ek naya khali PDF banana jisme sab merge hoga
                const mergedPdf = await PDFDocument.create();
                
                // 3. Har select ki gayi file ko loop mein process karna
                for (let file of fileInput.files) {
                    // File ko ArrayBuffer mein read karna (Chrome ko yeh format easily samajh aata hai)
                    const arrayBuffer = await file.arrayBuffer();
                    
                    // PDF load karna
                    const pdf = await PDFDocument.load(arrayBuffer);
                    
                    // Pages copy karna aur naye PDF mein daalna
                    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    copiedPages.forEach((page) => mergedPdf.addPage(page));
                }

                // 4. Final PDF ko save karke bytes generate karna
                const mergedPdfBytes = await mergedPdf.save();
                
                // 5. Download ke liye Blob aur URL banana
                const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = "ZingArena_Merged.pdf";
                a.click();
                
                status.innerText = "Done! Download ho gaya 🚀";
            } catch (error) {
                console.error(error);
                status.innerText = "Error aa gaya! PDF corrupt toh nahi hai check karo.";
            } finally {
                btn.disabled = false; // Button wapas normal ho jayega
            }
        }
    </script>
</body>
</html>
