<!-- ==========================================================================
     FEATURE 2: TEXT TO SPEECH AUDIO READER (FIXED & ERROR-FREE)
     ========================================================================== -->

<div class="audioreader-tool-container">
  <div class="tool-header">
    <span class="tool-badge">[ 🔊 AudioReader Pro v2 ]</span>
    <h3>Text to Speech Reader (Auto-Translate)</h3>
  </div>

  <div class="control-row">
    <label for="ttsLang">Select Target Language:</label>
    <select id="ttsLang" class="lang-select">
      <!-- Indian Languages -->
      <option value="hi-IN" data-code="hi" selected>Hindi - भारत (हिंदी)</option>
      <option value="en-IN" data-code="en">English (India)</option>
      <option value="bn-IN" data-code="bn">Bengali (বাংলা)</option>
      <option value="ta-IN" data-code="ta">Tamil (தமிழ்)</option>
      <option value="te-IN" data-code="te">Telugu (తెలుగు)</option>
      <option value="mr-IN" data-code="mr">Marathi (मराठी)</option>
      <option value="gu-IN" data-code="gu">Gujarati (ગુજરાતી)</option>
      <option value="ur-IN" data-code="ur">Urdu (اردو)</option>
      <!-- International Languages -->
      <option value="en-US" data-code="en">English (US)</option>
      <option value="en-GB" data-code="en">English (UK)</option>
      <option value="es-ES" data-code="es">Spanish (Español)</option>
      <option value="fr-FR" data-code="fr">French (Français)</option>
      <option value="de-DE" data-code="de">German (Deutsch)</option>
      <option value="ja-JP" data-code="ja">Japanese (日本語)</option>
      <option value="ko-KR" data-code="ko">Korean (한국어)</option>
      <option value="ru-RU" data-code="ru">Russian (Русский)</option>
      <option value="ar-SA" data-code="ar">Arabic (العربية)</option>
      <option value="it-IT" data-code="it">Italian (Italiano)</option>
      <option value="pt-BR" data-code="pt">Portuguese (Português)</option>
    </select>
  </div>

  <textarea id="ttsInput" class="text-box" placeholder="Type text here. Long paragraphs are now fully supported!" rows="4">what are you doing</textarea>

  <div id="previewBox" class="preview-box" style="display: none;">
    <span class="preview-label">Translated Voice Text:</span>
    <p id="translatedTextDisplay"></p>
  </div>

  <div class="button-group">
    <button id="playTtsBtn" class="btn btn-primary" onclick="startTextToSpeech()">🔊 Listen Now</button>
    <button id="stopTtsBtn" class="btn btn-danger" onclick="stopTextToSpeech()">⏹️ Stop Audio</button>
    <button class="btn btn-outline" onclick="clearTtsText()">🗑️ Clear</button>
  </div>

  <p id="ttsStatus" class="status-text">Status: Ready to Play</p>
</div>

<!-- ================= SCRIPT (JS) ================= -->
<script>
  // Pre-load voices to fix empty array bug across browsers
  let cachedVoices = [];
  function loadVoices() {
    if ("speechSynthesis" in window) {
      cachedVoices = window.speechSynthesis.getVoices();
    }
  }
  loadVoices();
  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  async function startTextToSpeech() {
    const textInput = document.getElementById("ttsInput").value.trim();
    const selectElem = document.getElementById("ttsLang");
    const fullLangCode = selectElem.value;
    const shortLangCode = selectElem.options[selectElem.selectedIndex].getAttribute("data-code");
    const statusText = document.getElementById("ttsStatus");
    const previewBox = document.getElementById("previewBox");
    const translatedTextDisplay = document.getElementById("translatedTextDisplay");

    if (!textInput) {
      alert("Please enter or paste some text to listen.");
      return;
    }

    if (!("speechSynthesis" in window)) {
      alert("Text-to-speech is not supported in this browser.");
      return;
    }

    // Stop ongoing speech
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
    }

    statusText.innerText = "Status: Translating text...";
    previewBox.style.display = "none";

    let textToSpeak = textInput;

    try {
      // Step 1: Translate API Request with safety timeout
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000); // 5 sec timeout

      const translateUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${shortLangCode}&dt=t&q=${encodeURIComponent(textInput)}`;
      const response = await fetch(translateUrl, { signal: controller.signal });
      clearTimeout(timeoutId);

      const data = await response.json();
      let translatedText = "";
      if (data && data[0]) {
        for (let i = 0; i < data[0].length; i++) {
          if (data[0][i][0]) translatedText += data[0][i][0];
        }
      }

      if (translatedText) {
        textToSpeak = translatedText;
        translatedTextDisplay.innerText = textToSpeak;
        previewBox.style.display = "block";
      }
    } catch (error) {
      console.warn("Translation skipped or timed out, using original text.", error);
    }

    statusText.innerText = "Status: Playing audio...";

    // Step 2: Chunking long text to prevent browser speech cutoff errors
    speakTextInChunks(textToSpeak, fullLangCode, shortLangCode, statusText);
  }

  function speakTextInChunks(text, fullLangCode, shortLangCode, statusText) {
    // Split text into sentences using punctuation marks to avoid buffer overload
    const sentences = text.match(/[^.!?]+[.!?]+|\s*[^.!?]+$/g) || [text];
    
    let index = 0;

    function speakNext() {
      if (index >= sentences.length) {
        statusText.innerText = "Status: Audio finished.";
        return;
      }

      const utterance = new SpeechSynthesisUtterance(sentences[index].trim());
      utterance.lang = fullLangCode;
      utterance.rate = 1.0;

      // Match best available voice
      if (cachedVoices.length === 0) loadVoices();
      const matchedVoice = cachedVoices.find(v => v.lang.replace("_", "-").toLowerCase() === fullLangCode.toLowerCase()) || 
                           cachedVoices.find(v => v.lang.toLowerCase().startsWith(shortLangCode.toLowerCase()));
      if (matchedVoice) {
        utterance.voice = matchedVoice;
      }

      utterance.onend = () => {
        index++;
        speakNext();
      };

      utterance.onerror = (event) => {
        console.error("TTS Chunk Error:", event);
        statusText.innerText = "Status: Error playing audio segment.";
      };

      window.speechSynthesis.speak(utterance);
    }

    speakNext();
  }

  function stopTextToSpeech() {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      document.getElementById("ttsStatus").innerText = "Status: Audio stopped.";
    }
  }

  function clearTtsText() {
    document.getElementById("ttsInput").value = "";
    document.getElementById("previewBox").style.display = "none";
    document.getElementById("ttsStatus").innerText = "Status: Ready to Play";
  }
</script>
