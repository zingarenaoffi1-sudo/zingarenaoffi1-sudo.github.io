<!-- ==========================================================================
     FEATURE 2: TEXT TO SPEECH AUDIO READER (WITH AUTO-TRANSLATE & 18+ LANGUAGES)
     All-in-One: HTML + CSS + JS Merged (100% Fixed for Chrome / Win 7)
     ========================================================================== -->

<div class="audioreader-tool-container">
  <div class="tool-header">
    <span class="tool-badge">[ 🔊 AudioReader Pro ]</span>
    <h3>Text to Speech Reader (Auto-Translate)</h3>
  </div>

  <div class="control-row">
    <label for="ttsLang">Select Target Language:</label>
    <select id="ttsLang" class="lang-select">
      <!-- Indian Languages -->
      <option value="hi-IN" data-code="hi" selected>Hindi - भारत (हिंदी)</option>
      <option value="en-IN" data-code="en">English (India)</option>
      <option value="bn-IN" data-code="bn">Bengali (বাংলা)</option>
      <option value="ta-IN" data-code="ta">Tamil (தமிழ்)</option>
      <option value="te-IN" data-code="te">Telugu (తెలుగు)</option>
      <option value="mr-IN" data-code="mr">Marathi (मराठी)</option>
      <option value="gu-IN" data-code="gu">Gujarati (ગુજરાતી)</option>
      <option value="ur-IN" data-code="ur">Urdu (اردو)</option>
      <!-- International Languages -->
      <option value="en-US" data-code="en">English (US)</option>
      <option value="en-GB" data-code="en">English (UK)</option>
      <option value="es-ES" data-code="es">Spanish (Español)</option>
      <option value="fr-FR" data-code="fr">French (Français)</option>
      <option value="de-DE" data-code="de">German (Deutsch)</option>
      <option value="ja-JP" data-code="ja">Japanese (日本語)</option>
      <option value="ko-KR" data-code="ko">Korean (한국어)</option>
      <option value="ru-RU" data-code="ru">Russian (Русский)</option>
      <option value="ar-SA" data-code="ar">Arabic (العربية)</option>
      <option value="it-IT" data-code="it">Italian (Italiano)</option>
      <option value="pt-BR" data-code="pt">Portuguese (Português)</option>
    </select>
  </div>

  <textarea id="ttsInput" class="text-box" placeholder="Type in any language (e.g. 'what are you doing'). It will auto-translate & speak!" rows="4">what are you doing</textarea>

  <!-- Translated Preview Box (Taaki user ko pata chale kya translate hua) -->
  <div id="previewBox" class="preview-box" style="display: none;">
    <span class="preview-label">Translated Voice Text:</span>
    <p id="translatedTextDisplay"></p>
  </div>

  <div class="button-group">
    <button id="playTtsBtn" class="btn btn-primary" onclick="startTextToSpeech()">🔊 Listen Now</button>
    <button id="stopTtsBtn" class="btn btn-danger" onclick="stopTextToSpeech()">⏹️ Stop Audio</button>
    <button class="btn btn-outline" onclick="clearTtsText()">🗑️ Clear</button>
  </div>

  <p id="ttsStatus" class="status-text">Status: Ready to Play</p>
</div>

<!-- ================= STYLE (CSS) ================= -->
<style>
  .audioreader-tool-container {
    max-width: 600px;
    margin: 20px auto;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
  }
  .audioreader-tool-container .tool-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
  }
  .audioreader-tool-container .tool-badge {
    background: #eef6ff;
    color: #0066cc;
    font-size: 13px;
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .audioreader-tool-container h3 {
    margin: 0;
    font-size: 18px;
    color: #333;
  }
  .audioreader-tool-container .control-row {
    margin-bottom: 12px;
    color: #444;
  }
  .audioreader-tool-container .lang-select {
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 5px;

    margin-left: 8px;

  }
  .audioreader-tool-container .text-box {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border: 1px solid #ccc;

    box-sizing: border-box;

    background: #f8f9fa;

</style>

<!-- ================= SCRIPT (JS) ================= -->
<script>
  // Global variable to prevent Chrome Garbage Collection Bug
  let activeUtterance = null;

  async function startTextToSpeech() {
    const textInput = document.getElementById("ttsInput").value.trim();
    const selectElem = document.getElementById("ttsLang");
    const fullLangCode = selectElem.value; // e.g., 'hi-IN'
    const shortLangCode = selectElem.options[selectElem.selectedIndex].getAttribute("data-code"); // e.g., 'hi'
    const statusText = document.getElementById("ttsStatus");
    const previewBox = document.getElementById("previewBox");
    const translatedTextDisplay = document.getElementById("translatedTextDisplay");

    if (!textInput) {
      alert("Please enter or paste some text to listen.");
      return;
    }

    if (!("speechSynthesis" in window)) {
      alert("Text-to-speech is not supported in this browser.");
      return;
    }

    // Stop any existing speech
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
    }

    statusText.innerText = "Status: Translating text...";
    previewBox.style.display = "none";

    try {
      // Step 1: Free Auto-Translate API call (zero API key required)
      const translateUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${shortLangCode}&dt=t&q=${encodeURIComponent(textInput)}`;
      const response = await fetch(translateUrl);
      const data = await response.json();
      
      let translatedText = "";
      for (let i = 0; i < data[0].length; i++) {
        translatedText += data[0][i][0];
      }

      // Step 2: Show translated text on UI
      translatedTextDisplay.innerText = translatedText;
      previewBox.style.display = "block";
      statusText.innerText = "Status: Playing audio...";

      // Step 3: Speak the Translated Text (with 50ms safety timeout)
      setTimeout(() => {
        activeUtterance = new SpeechSynthesisUtterance(translatedText);
        activeUtterance.lang = fullLangCode;
        activeUtterance.rate = 1.0;

        // Try to match the best available browser voice
        const voices = window.speechSynthesis.getVoices();
        const matchedVoice = voices.find(v => v.lang.replace("_", "-").toLowerCase() === fullLangCode.toLowerCase()) || 
                             voices.find(v => v.lang.toLowerCase().startsWith(shortLangCode.toLowerCase()));
        if (matchedVoice) {
          activeUtterance.voice = matchedVoice;
        }

        activeUtterance.onend = () => {
          statusText.innerText = "Status: Audio finished.";
        };

        activeUtterance.onerror = (event) => {
          console.error("TTS Error:", event);
          statusText.innerText = "Status: Error playing audio. Voice may not be installed on this PC.";
        };

        window.speechSynthesis.speak(activeUtterance);
      }, 50);

    } catch (error) {
      console.error("Translation Error:", error);
      statusText.innerText = "Status: Translation failed. Playing original text...";
      // Fallback: Agar internet slow ho toh original text bolega
      setTimeout(() => {
        activeUtterance = new SpeechSynthesisUtterance(textInput);
        activeUtterance.lang = fullLangCode;
        window.speechSynthesis.speak(activeUtterance);
      }, 50);
    }
  }

  function stopTextToSpeech() {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      document.getElementById("ttsStatus").innerText = "Status: Audio stopped.";
    }
  }

  function clearTtsText() {
    document.getElementById("ttsInput").value = "";
    document.getElementById("previewBox").style.display = "none";
    document.getElementById("ttsStatus").innerText = "Status: Ready to Play";
  }

  // Load browser voices automatically in background
  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.getVoices();
    };
  }
</script>
